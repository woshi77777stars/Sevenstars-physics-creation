name: verify

on:
  push:
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Verify plugin manifest and marketplace
        run: python scripts/verify.py
      - name: Smoke-build all PPT decks
        run: python plugins/alevel-physics-animations/scripts/anim.py ppt-all --out work/ppt-smoke
      - name: Download vendored wheels for the offline package
        run: python -m pip download -d work/wheels -r requirements.txt
      - name: Render one scene end-to-end
        run: python plugins/alevel-physics-animations/scripts/anim.py render physical-quantities --scene UnitsAndVectors --out work/smoke
      - name: Build offline package
        run: python scripts/dist.py --local
      - uses: actions/upload-artifact@v4
        with:
          name: offline-package-ubuntu
          path: dist/*.zip
          if-no-files-found: warn

  verify-other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (no Manim: needs system cairo on macOS)
        run: python -m pip install pytest python-pptx pillow numpy imageio-ffmpeg
      - name: Run tests
        run: python -m pytest tests -q
      - name: Verify plugin manifest and marketplace
        run: python scripts/verify.py
      - name: Smoke-build all PPT decks
        run: python plugins/alevel-physics-animations/scripts/anim.py ppt-all --out work/ppt-smoke
      - name: Download vendored wheels (Manim available on Windows only)
        if: runner.os == 'Windows'
        run: python -m pip download -d work/wheels -r requirements.txt
      - name: Download vendored wheels (macOS, no Manim)
        if: runner.os == 'macOS'
        run: python -m pip download -d work/wheels python-pptx pillow numpy imageio-ffmpeg
      - name: Build offline package
        run: python scripts/dist.py --local
      - uses: actions/upload-artifact@v4
        with:
          name: offline-package-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: warn
